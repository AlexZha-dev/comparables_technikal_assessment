[project]
name = "comparables"
version = "0.1.0"
description = "Agentic search system over a 50k company catalog (Comparables.ai technical assessment)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Candidate" }]

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # Config & validation
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    # Logging
    "structlog>=24.1",
    # HTTP async client (also for Ollama via OpenAI-compat)
    "httpx>=0.27",
    "openai>=1.40",
    # LangGraph
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # Data
    "rank-bm25>=0.2.2",
    "aiosqlite>=0.20",
    # Tokens (for cost estimation fallback)
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.pytest_asyncio]
default_loop_scope = "function"
