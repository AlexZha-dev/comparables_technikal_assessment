# Comparables.ai — full stack
#
# Brings up:
#   - ollama:    the LLM server (with the configured model auto-pulled)
#   - app:       the FastAPI service
#
# Usage:
#   docker compose up --build        # build + run
#   docker compose run --rm app python -m scripts.ingest        # one-shot ingestion
#   docker compose run --rm app python -m scripts.run_eval       # run eval

services:
  ollama:
    image: ollama/ollama:latest
    container_name: comparables-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # One-shot pull of the configured model. Keeps the app portable across
  # LLM__MODEL choices — change in .env and re-run.
  ollama-pull:
    image: curlimages/curl:8.10.1
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: ${LLM__MODEL:-ministral-3:3b}
    entrypoint: ["sh", "-c"]
    command: >
      "echo Pulling $${MODEL}... &&
       curl -fsS -X POST $${OLLAMA_HOST}/api/pull
       -H 'Content-Type: application/json'
       -d '{\"name\":\"'$${MODEL}'\",\"stream\":false}' &&
       echo Done."
    restart: "no"

  app:
    build: .
    container_name: comparables-app
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    environment:
      API__HOST: 0.0.0.0
      API__PORT: 8000
      API__LOG_JSON: "true"
      API__LOG_LEVEL: ${API__LOG_LEVEL:-INFO}
      LLM__BASE_URL: http://ollama:11434/v1
      LLM__API_KEY: ollama
      LLM__MODEL: ${LLM__MODEL:-ministral-3:3b}
      LLM__TIMEOUT_S: ${LLM__TIMEOUT_S:-120}
      LIMITS__TIMEOUT_S: ${LIMITS__TIMEOUT_S:-120}
      PATHS__COMPANIES_JSON: /app/companies.json
      PATHS__SQLITE: /app/data/companies.sqlite
      PATHS__BM25_PICKLE: /app/data/bm25.pkl
      PATHS__RUNS_DIR: /app/runs
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./runs:/app/runs
      # Mount the dataset read-only; ingestion reads it on demand.
      - ./companies.json:/app/companies.json:ro
    restart: unless-stopped

volumes:
  ollama_data:
